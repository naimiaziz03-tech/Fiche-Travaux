<title>Fiche de travaux — تعبئة تلقائية</title>
<style>
:root{color-scheme:light dark;--bg:#f7f6f2;--card:#fff;--ink:#1f2328;--mut:#6b7280;--line:#e3e0d8;--acc:#0f766e;--accink:#fff;--we:#fdecec;--red:#c62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14161a;--card:#1d2025;--ink:#eceff3;--mut:#9aa3af;--line:#2c3138;--acc:#2dd4bf;--accink:#04201c;--we:#2a1b1d;--red:#ef6b6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14161a;--card:#1d2025;--ink:#eceff3;--mut:#9aa3af;--line:#2c3138;--acc:#2dd4bf;--accink:#04201c;--we:#2a1b1d;--red:#ef6b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,"Noto Naskh Arabic",Tahoma,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 24px}
.top{display:flex;align-items:center;gap:10px;position:relative;margin:6px 0 2px}
.top h1{margin:0}
.ic{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:0}
#menu{position:absolute;top:100%;inset-inline-start:0;z-index:15;margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:230px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#menu[hidden],#toast[hidden]{display:none}
#menu button{display:block;width:100%;text-align:start;padding:11px 12px;border:0;background:none;color:var(--ink);border-radius:8px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:30}
h1{font-size:22px;margin:6px 0 2px}
.sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:grid;grid-template-columns:2fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:3px}
input[type=checkbox]{width:20px;height:20px;margin:0}
textarea{resize:vertical}
details summary{cursor:pointer;font-weight:600}
details .g2,details .g3{margin-top:10px}
.g2,.g3,.g4{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:1fr 1fr}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;scroll-margin-top:12px}
.day.we{background:var(--we)}
.dh{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;cursor:pointer}
.dh b{font-size:18px;min-width:26px}
.dh i{font-style:normal;font-weight:700;min-width:26px;text-align:center;border-radius:6px;padding:0 6px;background:var(--bg)}
.we .dh i{color:var(--red)}
.dh span{flex:1;color:var(--mut);font-size:13px;white-space:normal;word-break:break-word}
.fm{padding:4px 12px 14px;border-top:1px dashed var(--line)}
.fm h4{margin:12px 0 6px;font-size:13px}
.fm label+label,.fm .g2+label{margin-top:8px}
.cks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px}
.ck{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:14px}
.act{display:flex;gap:8px;margin-top:14px}
button{font:inherit;cursor:pointer}
.act button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.act .gh{color:var(--red)}
.bar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
#tot{flex:1;font-size:12.5px;color:var(--mut)}
#msg{display:block;margin-top:2px}
#dl{background:var(--acc);color:var(--accink);border:0;border-radius:12px;padding:12px 16px;font-weight:700}
#dl:disabled{opacity:.6}
.g3 .ck{margin-top:24px}details.sub{margin-top:10px}.fm details summary{font-size:13px;color:var(--mut)}
.fm details.p2>summary{width:fit-content;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--card);color:var(--ink)}
#pvb{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px}
#pv{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#pv[hidden]{display:none}
.pvh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.pvh button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 14px}
.pvi{font-size:12px;padding:8px 14px;color:var(--mut);direction:ltr;text-align:left}
#pvt{flex:1;overflow:auto;background:#fff;color:#000;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px))}
#pvt table{border-collapse:collapse;font-size:12px;min-width:780px;direction:ltr;background:#fff;color:#000}
#pvt th,#pvt td{border:1px solid #b5b5b5;padding:4px 6px;text-align:center;white-space:nowrap}
#pvt th{background:#f2f2f2;font-weight:600}
#pvt td.tw{white-space:normal;min-width:150px;text-align:start}
#pvt tr.we td:nth-child(2){color:#c00000;font-weight:700}
#pvt tr.tot td{font-weight:700;background:#f2f2f2}
.day.rd .dh span{color:var(--red)}
.day.op{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.day.today .dh b{background:var(--acc);color:var(--accink);border-radius:8px;padding:0 6px;min-width:0}
.sg{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sg:empty{display:none}
.chip{border:1px solid var(--acc);color:var(--acc);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px}
#pvt tr.red td{color:#c00000}
.note{font-size:12.5px;color:var(--mut);margin:4px 2px 12px}
.ckrow{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink)}
/* alignment fix */
.g2>label,.g3>label,.g4>label,.cks>label{margin-top:0}
.g2,.g3,.g4{align-items:end}
.g2,.g3,.g4{grid-template-columns:repeat(var(--c),minmax(0,1fr))}
.g2{--c:2}.g3{--c:3}.g4{--c:2}
input:not([type=checkbox]),select{height:44px;box-sizing:border-box}
.g3 .ck{margin-top:0;height:44px;justify-content:center;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.cks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cks .ck{margin-top:0;justify-content:center;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
</style>
</head>
<body>
<main>
<div class="top"><button id="mn" class="ic" aria-label="menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1>Fiche de travaux</h1>
<div id="menu" hidden><button id="mx">إرسال / حفظ نسخة كاملة للمعلومات</button><button id="mi">استرجاع نسخة</button></div></div>
<input type="file" id="imf" accept=".json,application/json" hidden>
<div id="toast" hidden></div>
<p class="sub">أدخل معلومات كل يوم، والتطبيق يملأ لك ملف Excel بنفس تنسيق نموذجك.</p>

<section class="card row">
<label>الشهر<select id="mo"></select></label>
<label>السنة<input id="yr" type="number" dir="ltr" min="2000" max="2100"></label>
</section>

<details class="card">
<summary>بيانات الموظف والمصلحة</summary>
<div class="g2">
<label>Nom et Prénom<input data-set="sn" dir="auto"></label>
<label>Mle<input data-set="sm" dir="auto"></label>
<label>Classement<input data-set="sc" dir="auto"></label>
<label>Service<input data-set="ss" dir="auto"></label>
</div>
<label style="margin-top:8px">Code Etbl<input data-set="sk" dir="auto"></label>
</details>

<div id="list"></div>

<details class="card">

function has(D){return Object.keys(D).some(k=>D[k])}
function fillSheet(xml,y,m,days,ex,set,rm){
  const n=new Date(y,m+1,0).getDate(),T={K:0,L:0,M:0,R:0,S:0,T:0,U:0};
  for(let d=1;d<=31;d++){
    const r=12+d,ok=d<=n,w=new Date(y,m,d).getDay(),D=ok?(days[d]||{}):{};
    xml=setCell(xml,'A'+r,ok?String(d):'');
    xml=setCell(xml,'B'+r,ok?DOW[w]:'',ok&&(w===0||w===6)?28:18);
    'CDEFGHIJ'.split('').forEach((c,i)=>{xml=setCell(xml,c+r,tt(D,i))});
    const kv=hrs(D,w);if(kv)T.K+=kv;xml=setCell(xml,'K'+r,kv||'');
    const lv=kv?rd(kv*(spc(D)&&spc(D)[3]?1:(w===0?1.75:1.5))):0;if(lv)T.L+=lv;xml=setCell(xml,'L'+r,lv||'');
    const pv=D.m?1:0;if(pv)T.M+=pv;xml=setCell(xml,'M'+r,pv||'');
    xml=setCell(xml,'N'+r,D.w||'');
    const q=num(D.q);xml=setCell(xml,'Q'+r,q==null?(D.q||''):q);
    [['R','c1'],['S','c2'],['T','c3'],['U','c4']].forEach(([c,k])=>{if(D[k])T[c]++;xml=setCell(xml,c+r,D[k]?1:'')});
    if(ok&&rm&&isR(D))'ABCDEFGHIJKLMNOPQRSTUV'.split('').forEach(c=>{xml=restyle(xml,c+r,rm)});
  }
  Object.keys(T).forEach(c=>{xml=setCalc(xml,c+'44',rd(T[c]))});
  xml=setCalc(xml,'N48',rd(T.L));xml=setCalc(xml,'O48',rd(T.K));
  xml=setCell(xml,'R4',MONTHS[m]+' '+y);
  xml=setCell(xml,'R5',set.ss||'');xml=setCell(xml,'S6',set.sk||'');
  xml=setCell(xml,'C8','                Nom et Prénom : '+set.sn+'                        Mle : '+set.sm+'                             Classement : '+set.sc+'    ');
  [['C48','c'],['E48','e'],['G48','g'],['I48','i'],['K48','k']].forEach(([ref,k])=>{xml=setCell(xml,ref,ex[k]||'_')});
  const rc=num(ex.rc);xml=setCell(xml,'P48',rc==null?(ex.rc||''):rc);
  xml=setCell(xml,'N44','Kilométrage:'+(ex.km?' '+ex.km:''));
  xml=setCell(xml,'N45','Puissance fiscale'+(ex.pf?' '+ex.pf:''));
  return xml;
}
function restyle(xml,ref,map){
  return xml.replace(new RegExp('(<c r="'+ref+'"(?:\\s+[\\w:]+="[^"]*")*?\\s)s="(\\d+)"'),(m,a,s)=>a+'s="'+(map[s]!=null?map[s]:s)+'"');
}
function redMap(sx,st){
  const xl=st.match(/<cellXfs[^>]*>([\s\S]*?)<\/cellXfs>/)[1].match(/<xf\b[^>]*?\/>|<xf\b[^>]*>[\s\S]*?<\/xf>/g);
  const fl=st.match(/<fonts[^>]*>([\s\S]*?)<\/fonts>/)[1].match(/<font\b[^>]*?\/>|<font\b[^>]*>[\s\S]*?<\/font>/g);
  const used=new Set([18,28]);
  const re=/<c r="[A-V](?:1[3-9]|2\d|3\d|4[0-3])"((?:\s+[\w:]+="[^"]*")*)/g;let m;
  while((m=re.exec(sx))){const s=(m[1].match(/\ss="(\d+)"/)||[])[1];if(s!=null)used.add(+s);}
  const nf=[],nx=[],map={},fm={};
  used.forEach(id=>{
    const x=xl[id];if(!x)return;
    const fid=+x.match(/fontId="(\d+)"/)[1];
    if(!(fid in fm)){let f=fl[fid];
      f=/<color\b[^>]*\/>/.test(f)?f.replace(/<color\b[^>]*\/>/,'<color rgb="FFFF0000" />'):f.replace(/(<sz\b[^>]*\/>)/,'$1<color rgb="FFFF0000" />');
      fm[fid]=fl.length+nf.length;nf.push(f);}
    map[id]=xl.length+nx.length;nx.push(x.replace(/fontId="\d+"/,'fontId="'+fm[fid]+'"'));
  });
  let out=st.replace(/(<fonts\b[^>]*count=")\d+(")/,'$1'+(fl.length+nf.length)+'$2').replace('</fonts>',nf.join('')+'</fonts>');
  out=out.replace(/(<cellXfs\b[^>]*count=")\d+(")/,'$1'+(xl.length+nx.length)+'$2').replace('</cellXfs>',nx.join('')+'</cellXfs>');
  return {styles:out,map};
}
function stripVisa(dx){
  return dx.replace(/<xdr:twoCellAnchor[\s\S]*?<\/xdr:twoCellAnchor>/g,a=>{
    const c=a.match(/<xdr:from><xdr:col>(\d+)<\/xdr:col>[\s\S]*?<xdr:row>(\d+)<\/xdr:row>/);
    return c&&c[1]==='21'&&['12','13','43'].includes(c[2])?'':a;
  });
}

const $=s=>document.querySelector(s);
const DEF={sn:'NAIMI AZIZ',sm:'83684 L',sc:'05/09/07',ss:':Maintenence TAZA',sk:' :ITOF R1P1'};
const st={y:0,m:0,days:{},ex:{},set:{...DEF},open:0};
const ls={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const mk=()=>'ft:'+st.y+'-'+st.m;
const hd=(d,D)=>hrs(D,new Date(st.y,st.m,+d).getDay());
const nmv=(d,D)=>rd(hd(d,D)*(spc(D)&&spc(D)[3]?1:(new Date(st.y,st.m,+d).getDay()===0?1.75:1.5)));
function load(){const d=ls.get(mk())||{};st.days=d.days||{};st.ex=d.ex||{};
  document.querySelectorAll('[data-ex]').forEach(i=>{i.value=st.ex[i.dataset.ex]||''});}
function save(){ls.set(mk(),{days:st.days,ex:st.ex});ls.set('ft:set',st.set);}

const TOPT=(()=>{const a=[];for(let h=0;h<24;h++)for(const m of['00','30'])a.push(String(h).padStart(2,'0')+':'+m);return a})();
function tsel(d,k,lab,v){
  const o=TOPT.slice();if(v&&!o.includes(v)){o.push(v);o.sort();}
  return `<label>${lab}<select data-d="${d}" data-k="${k}" dir="ltr"><option value=""></option>${o.map(x=>`<option value="${x}"${x===v?' selected':''}>${x.replace(':','h')}</option>`).join('')}</select></label>`;
}
function inp(d,k,type,lab,att){const v=(st.days[d]||{})[k]??'';if(type==='time')return tsel(d,k,lab,v);
  return `<label>${lab}<input data-d="${d}" data-k="${k}" type="${type}" dir="ltr" value="${esc(v)}" ${att||''}></label>`;}
function chk(d,k,lab){const v=(st.days[d]||{})[k];
  return `<label class="ck"><input data-d="${d}" data-k="${k}" type="checkbox" ${v?'checked':''}>${lab}</label>`;}
const SUG=['Travaux au Centre','Congé annuel','Repos Statutaire','Repos Compensateur','Jour Férié'];
const nz=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function sgh(v){const s=nz(v);if(s.length<2)return '';return SUG.filter(x=>nz(x).startsWith(s)&&nz(x)!==s).map(x=>`<button type="button" class="chip" data-sg="${x}">${x}</button>`).join('');}
function p2(d,a,b){const D=st.days[d]||{};return `<details class="sub p2"${D[a]||D[b]?' open':''}><summary>+ فترة ثانية</summary><div class="g4" style="margin-top:8px">${inp(d,a,'time','de')}${inp(d,b,'time','à')}</div></details>`;}
function form(d){const D=st.days[d]||{};
  return `<div class="fm">
<label>Travaux effectués<textarea data-d="${d}" data-k="w" rows="2" dir="auto">${esc(D.w||'')}</textarea></label><div class="sg" id="sg${d}">${sgh(D.w)}</div>
<h4>النهار · Jour (5h–21h)</h4><div class="g4">${inp(d,'t0','time','de')}${inp(d,'t1','time','à')}</div>${p2(d,'t2','t3')}
<details class="sub"${D.t4||D.t5||D.t6||D.t7?' open':''}><summary>الليل · Nuit (21h–5h)</summary><div class="g4" style="margin-top:8px">${inp(d,'t4','time','de')}${inp(d,'t5','time','à')}</div>${p2(d,'t6','t7')}</details>
<h4>الساعات · Total HS / Panier</h4><div class="g3"><label>NM (تلقائي)<input id="nm${d}" readonly dir="ltr" value="${hd(d,D)||''}"></label><label>M (تلقائي)<input id="mh${d}" readonly dir="ltr" value="${hd(d,D)?nmv(d,D):''}"></label>${chk(d,'m','Panier')}</div>

<details class="sub"${D.q?' open':''}><summary>Frais de voyage</summary><div style="margin-top:8px">${inp(d,'q','number','المبلغ','step="0.01" min="0" inputmode="decimal"')}</div></details>
<h4>Déplacement</h4>
<div class="cks" dir="ltr">${chk(d,'c1','P.Déj')}${chk(d,'c2','Déj')}${chk(d,'c3','Din')}${chk(d,'c4','Déc')}</div>
<div class="act"><button data-act="cp">نسخ من اليوم السابق</button></div></div>`;}
function sum(d){const D=st.days[d]||{},p=[];if(D.w)p.push(D.w);
  for(let i=0;i<8;i+=2)if(!spc(D)&&tt(D,i)&&tt(D,i+1))p.push(tt(D,i)+'–'+tt(D,i+1));
  
  
  
  return p.join(' · ')||'—';}
function totals(){const n=new Date(st.y,st.m+1,0).getDate();let a=0,b=0,c=0;
  for(let d=1;d<=n;d++){const D=st.days[d]||{};a+=hd(d,D);b+=nmv(d,D);c+=(D.m&&has(D))?1:0;}
  $('#tot').innerHTML='NM '+rd(a)+' · M '+rd(b)+' · Panier '+rd(c)+'<span id="msg"></span>';}
function render(){const n=new Date(st.y,st.m+1,0).getDate(),nw=new Date(),tdy=(nw.getFullYear()===st.y&&nw.getMonth()===st.m)?nw.getDate():0;let h='';
  for(let d=1;d<=n;d++){const w=new Date(st.y,st.m,d).getDay(),we=w===0||w===6;
    h+=`<div class="day${we?' we':''}${isR(st.days[d]||{})?' rd':''}${st.open===d?' op':''}${d===tdy?' today':''}" id="day${d}"><button class="dh" data-open="${d}"><b>${d}</b><i>${DOW[w]}</i><span id="sm${d}">${esc(sum(d))}</span></button>${st.open===d?form(d):''}</div>`;}
  $('#list').innerHTML=h;totals();}

$('#list').addEventListener('click',e=>{
  const sg=e.target.closest('[data-sg]');
  if(sg){const ta=sg.closest('.fm').querySelector('textarea');ta.value=sg.dataset.sg;ta.dispatchEvent(new Event('input',{bubbles:true}));return;}
  const b=e.target.closest('[data-open]');
  if(b){const d=+b.dataset.open;st.open=st.open===d?0:d;render();if(st.open)$('#day'+d).scrollIntoView({block:'start'});return;}
  const a=e.target.closest('[data-act]');
  if(a&&st.open){const d=st.open;
    if(a.dataset.act==='cp')st.days[d]={...(st.days[d-1]||{})};else delete st.days[d];
    save();render();}
});
document.addEventListener('input',e=>{const t=e.target,ds=t.dataset;
  if(ds.k){const d=ds.d;(st.days[d]=st.days[d]||{})[ds.k]=t.type==='checkbox'?t.checked:t.value;save();
    const s=$('#sm'+d);if(s)s.textContent=sum(d);const mh=$('#mh'+d);if(mh)mh.value=hd(d,st.days[d])?nmv(d,st.days[d]):'';const ne=$('#nm'+d);if(ne)ne.value=hd(d,st.days[d])||'';const dy=$('#day'+d);if(dy)dy.classList.toggle('rd',isR(st.days[d]));if(ds.k==='w'){const sg=$('#sg'+d);if(sg)sg.innerHTML=sgh(t.value);}totals();}
  else if(ds.set){st.set[ds.set]=t.value;save();}
  else if(ds.ex){st.ex[ds.ex]=t.value;save();}
});
function changeMonth(){const y=+$('#yr').value;if(!y)return;st.y=y;st.m=+$('#mo').value;const t=new Date();st.open=(t.getFullYear()===st.y&&t.getMonth()===st.m)?t.getDate():0;load();render();if(st.open)$('#day'+st.open).scrollIntoView({block:'start'});}
$('#mo').addEventListener('change',changeMonth);$('#yr').addEventListener('change',changeMonth);

function preview(){
  const n=new Date(st.y,st.m+1,0).getDate(),T={k:0,l:0,m:0,c1:0,c2:0,c3:0,c4:0},C=['c1','c2','c3','c4'];let rows='';
  for(let d=1;d<=n;d++){
    const D=st.days[d]||{},w=new Date(st.y,st.m,d).getDay(),h=hd(d,D),l=h?nmv(d,D):0;
    T.k+=h;T.l+=l;if(D.m)T.m++;C.forEach(c=>{if(D[c])T[c]++});
    rows+='<tr class="'+(w===0||w===6?'we':'')+(isR(D)?' red':'')+'"><td>'+d+'</td><td>'+DOW[w]+'</td>'+[0,1,2,3,4,5,6,7].map(i=>'<td>'+esc(tt(D,i))+'</td>').join('')+'<td>'+(h||'')+'</td><td>'+(l||'')+'</td><td>'+(D.m?1:'')+'</td><td class="tw">'+esc(D.w||'')+'</td><td>'+esc(D.q||'')+'</td>'+C.map(c=>'<td>'+(D[c]?1:'')+'</td>').join('')+'</tr>';
  }
  const th=s=>'<th>'+s+'</th>';
  const head='<tr>'+th('Date')+th('Jour')+'<th colspan="4">Jour (5h–21h)</th><th colspan="4">Nuit (21h–5h)</th>'+th('NM')+th('M')+th('Panier')+th('Travaux effectués')+th('Frais')+'<th colspan="4">Déplacement</th></tr><tr>'+th('')+th('')+['de','à','de','à','de','à','de','à'].map(x=>th(x)).join('')+th('')+th('')+th('')+th('')+th('')+['P.Déj','Déj','Din','Déc'].map(x=>th(x)).join('')+'</tr>';
  const tot='<tr class="tot"><td colspan="10">Total</td><td>'+rd(T.k)+'</td><td>'+rd(T.l)+'</td><td>'+T.m+'</td><td></td><td></td>'+C.map(c=>'<td>'+T[c]+'</td>').join('')+'</tr>';
  $('#pvi').textContent=MONTHS[st.m]+' '+st.y+' · '+(st.set.sn||'')+' · Mle '+(st.set.sm||'')+' · Classement '+(st.set.sc||'');
  $('#pvt').innerHTML='<table><thead>'+head+'</thead><tbody>'+rows+tot+'</tbody></table>';
  $('#pv').hidden=false;if(!(history.state&&history.state.pv)){try{history.pushState({pv:1},'')}catch(e){}}
}
$('#pvb').addEventListener('click',preview);
function closePv(){if(history.state&&history.state.pv){history.back();}else{$('#pv').hidden=true;}}
$('#pvx').addEventListener('click',closePv);
window.addEventListener('popstate',()=>{$('#pv').hidden=true});

function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true},2800);}
$('#mn').addEventListener('click',()=>{$('#menu').hidden=!$('#menu').hidden});
document.addEventListener('click',e=>{if(!e.target.closest('#menu,#mn'))$('#menu').hidden=true});
async function saveBlob(blob,fn){
  const dl=window.claude?await window.claude.use('downloads'):null;
  if(dl){await dl.save({filename:fn,data:blob});}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();}
}
$('#mx').addEventListener('click',async()=>{
  $('#menu').hidden=true;
  const o={app:'fiche-travaux',v:1,at:new Date().toISOString(),data:{}};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('ft:'))o.data[k]=JSON.parse(localStorage.getItem(k));}}catch(e){}
  const blob=new Blob([JSON.stringify(o)],{type:'application/json'});
  const fn='Fiche_sauvegarde_'+new Date().toISOString().slice(0,10)+'.json';
  try{
    const f=new File([blob],fn,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Fiche de travaux'});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  try{await saveBlob(blob,fn);toast('تم حفظ النسخة ✓');}catch(e){toast(e&&e.code==='declined'?'أُلغي الحفظ':'تعذّر حفظ النسخة');}
});
$('#mi').addEventListener('click',()=>{$('#menu').hidden=true;$('#imf').click();});
$('#imf').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const o=JSON.parse(await f.text());if(o.app!=='fiche-travaux'||!o.data)throw 0;
    Object.keys(o.data).forEach(k=>{if(k.startsWith('ft:'))ls.set(k,o.data[k]);});
    st.set={...DEF,...(ls.get('ft:set')||{})};
    document.querySelectorAll('[data-set]').forEach(i=>{i.value=st.set[i.dataset.set]||''});
    st.open=0;load();render();toast('تم الاسترجاع ✓');
  }catch(err){toast('ملف غير صالح');}
});

async function makeXlsx(){
  const zip=await JSZip.loadAsync(TPL,{base64:true});
  const sn=MONTHS[st.m]+' '+st.y;
  const sx=await zip.file('xl/worksheets/sheet1.xml').async('string');
  const rr=redMap(sx,await zip.file('xl/styles.xml').async('string'));
  zip.file('xl/styles.xml',rr.styles);
  zip.file('xl/worksheets/sheet1.xml',fillSheet(sx,st.y,st.m,st.days,st.ex,st.set,rr.map));
  let wb=await zip.file('xl/workbook.xml').async('string');
  wb=wb.replace(/name="Février 2024"/,'name="'+sn+'"').replace(/<calcPr([^>]*?)\s*\/>/,'<calcPr$1 fullCalcOnLoad="1"/>');
  zip.file('xl/workbook.xml',wb);
  const ap=zip.file('docProps/app.xml');
  if(ap)zip.file('docProps/app.xml',(await ap.async('string')).split('Février 2024').join(sn));
  if(!$('#visa').checked){const dr=zip.file('xl/drawings/drawing1.xml');
    if(dr)zip.file('xl/drawings/drawing1.xml',stripVisa(await dr.async('string')));}
  return zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',compression:'DEFLATE'});
}
$('#dl').addEventListener('click',async()=>{
  const b=$('#dl'),msg=t=>{const m=$('#msg');if(m)m.textContent=t};
  b.disabled=true;msg('جارٍ تحضير الملف…');
  try{
    const blob=await makeXlsx();
    const fn=((st.set.sn||'Fiche').trim().replace(/[^\w]+/g,'_')||'Fiche')+'_'+st.y+'-'+String(st.m+1).padStart(2,'0')+'.xlsx';
    const dl=window.claude?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:fn,data:blob});msg('تم الحفظ ✓');}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();msg('تم التنزيل ✓');}
  }catch(err){msg(err&&err.code==='declined'?'أُلغي الحفظ':'تعذّر إنشاء الملف');}
  b.disabled=false;
});

(function init(){
  const now=new Date();st.y=now.getFullYear();st.m=now.getMonth();
  $('#mo').innerHTML=MONTHS.map((n,i)=>`<option value="${i}">${n}</option>`).join('');
  $('#mo').value=st.m;$('#yr').value=st.y;
  st.set={...DEF,...(ls.get('ft:set')||{})};
  document.querySelectorAll('[data-set]').forEach(i=>{i.value=st.set[i.dataset.set]||''});
  st.open=now.getDate();load();render();
  setTimeout(()=>{const e=$('#day'+st.open);if(e)e.scrollIntoView({block:'start'})},80);
})();
</script>
